# Yalnızca kurulumdaki vekil (Caddy) sertifikayı kendisi alacaksa kullanılır.
# 443 portunu da açar; .env içinde LISTEN_HTTP_PORT=80, SITE_ADDRESS ve
# CERT_EMAIL verilmiş olmalıdır. Ayrıntı: docs/devreye-alma.md
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build

services:
  proxy:
    ports:
      - ${LISTEN_HTTPS_PORT:-443}:443
